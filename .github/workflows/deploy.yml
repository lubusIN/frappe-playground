name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Runtime Artifacts
        id: cache-runtime
        uses: actions/cache@v4
        with:
          path: artifacts/runtime
          key: ${{ runner.os }}-runtime-${{ hashFiles('runtime/apps/catalog.json', 'runtime/build/Dockerfile', 'scripts/build.sh') }}

      - name: Prepare Deploy Assets
        id: check_limits
        run: npm run deploy:prepare

      - name: Run fast contract tests
        run: npm run test:contract

      - name: Verify clean publish assembly
        run: npm run test:clean-build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium integration tests
        run: npm run test:e2e:chromium

      - name: Publish to Cloudflare Pages
        id: deploy
        if: steps.check_limits.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=frappe-playground
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Add deployment URL to summary
        if: steps.deploy.outputs.deployment-url != ''
        run: |
          echo "### Cloudflare Pages deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Update PR description with deployment URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const prNumber = context.issue.number;
            const startMarker = '<!-- DEPLOYMENT_URL_START -->';
            const endMarker = '<!-- DEPLOYMENT_URL_END -->';
            const newContent = `${startMarker}\n### ⚡ Live Preview\n**URL:** ${url}\n${endMarker}`;
            
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            
            let body = pullRequest.body || '';
            const startIndex = body.indexOf(startMarker);
            const endIndex = body.indexOf(endMarker);
            
            if (startIndex !== -1 && endIndex !== -1 && endIndex > startIndex) {
              body = body.substring(0, startIndex) + newContent + body.substring(endIndex + endMarker.length);
            } else if (startIndex !== -1) {
              body = body.substring(0, startIndex) + newContent;
            } else {
              body = body + '\n\n' + newContent;
            }
            
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: body
            });
